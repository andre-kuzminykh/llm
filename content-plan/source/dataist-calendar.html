$('#toolbar').addEventListener('change',ev=>{const input=ev.target;if(input.dataset.all){const kind=input.dataset.all;selections[kind].clear();document.querySelectorAll(`[data-menu="${kind}"] input[data-option]`).forEach(x=>x.checked=false);input.checked=true;updateFilterButtons();renderCalendar(true)}else if(input.dataset.option){const kind=input.dataset.option;input.checked?selections[kind].add(input.value):selections[kind].delete(input.value);document.querySelector(`[data-menu="${kind}"] [data-all]`).checked=selections[kind].size===0;updateFilterButtons();renderCalendar(true)}});
document.addEventListener('click',ev=>{if(!ev.target.closest('.filter'))closeMenus()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&openFilter){const b=document.querySelector(`[data-filter-toggle="${openFilter}"]`);closeMenus();b.focus()}});
for(const [kind,label]of [['channels','Каналы'],['topics','Темы'],['platforms','Площадки']]){const wrap=document.createElement('div');wrap.className='filter';wrap.innerHTML=`<button class="filter-toggle" data-filter-toggle="${kind}" aria-expanded="false" aria-haspopup="dialog" aria-controls="menu-${kind}">${icon(kind,'leading')}<span>${label}</span><span class="count"></span>${icon('down','chevron')}</button><div class="menu" id="menu-${kind}" data-menu="${kind}" role="dialog" aria-label="${label}" hidden><label class="menu-search">${icon('search')}<input type="search" data-search="${kind}" placeholder="Найти…" aria-label="Найти: ${label}"></label><div class="menu-options"></div></div>`;$('#toolbar').insertBefore(wrap,$('#themeToggle'))}
refreshData();themeApply();updateFilterButtons();renderCalendar();
</script></body></html>
